plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lcklive'
    compileSdk 35

    defaultConfig {
        // 워치 앱과 applicationId 가 같아야 폰 ↔ 워치 데이터 동기화가 된다
        applicationId 'com.example.lcklive'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':shared')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'   // 워치로 팀 보내기
}
